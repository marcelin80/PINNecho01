# Tiny/fast configuration for CPU smoke tests and CI. Not for science -- just
# exercises the full generate -> train -> evaluate -> compare pipeline quickly.
experiment: smoke
seed: 0
device: cpu

geometry:
  r0_x: 0.020
  r0_y: 0.030
  strain_amplitude: 0.18

flow:
  period: 0.9
  vortex_strength: 0.35
  inflow_strength: 0.25
  pressure_amplitude: 400.0

doppler:
  transducers: [[-0.055, -0.045], [0.055, -0.045]]
  n_points_per_frame: 60
  n_frames: 6
  noise_level: 0.02

collocation:
  n_interior: 800
  n_wall: 200
  n_frames: 8

model:
  hidden_width: 48
  hidden_depth: 3
  fourier_features: 0
  output_pressure: true

physics:
  backbone: baseline

train:
  iterations: 400
  lr: 0.002
  physics_warmup_frac: 0.3
  lbfgs_iters: 0
  lr_decay_every: 250
  batch_interior: 512
  batch_wall: 128
  log_every: 200
